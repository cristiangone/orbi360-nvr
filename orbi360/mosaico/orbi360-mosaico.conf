# Configuracion del mosaico SRT de Orbi360 NVR (/etc/orbi360-mosaico.conf)
# Despues de editar: systemctl restart orbi360-mosaico

# Las 4 camaras, en orden: arriba-izq, arriba-der, abajo-izq, abajo-der.
# Son los nombres de las camaras en Orbi360 NVR (streams de go2rtc).
CAMS="CAMARA1 CAMARA2 CAMARA3 CAMARA4"

# sub: usa el stream secundario de cada camara (liviano, recomendado)
# main: usa el principal (mas nitido, pero decodificar 4 streams de 5 MP es pesado)
SOURCE=sub

SRT_PORT=9999         # UDP. El cliente se conecta con srt://IP:9999?mode=caller&latency=5000
SRT_LATENCY=5000      # ms
BITRATE=2500          # kbit/s
FPS=15
TILE_W=960            # cada cuadro; 960x540 da un canvas 1920x1080
TILE_H=540

# auto: usa la iGPU Intel (VA-API) si existe, si no libx264 por CPU
ENCODER=auto
